<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Turno - Pilatea</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="page-reserva">
    <header class="main-header">
        <div class="logo-container">
            <a href="../index.html"><img src="../assets/img/logo-pilatea-removebg-preview.png" alt="Logo"></a>
        </div>
        <div class="header-actions">
            <span id="user-welcome">Hola, Alumno</span>
            <a href="../index.html" class="btn-back">Cerrar Sesión</a>
        </div>
    </header>

    <main class="reservation-container">
        <div class="booking-wrapper">
            <div class="calendar-column">
                <div class="calendar-header">
                    <button id="prev-month"><i class="fa-solid fa-chevron-left"></i></button>
                    <h3 id="calendar-month-year">febrero 2026</h3>
                    <button id="next-month"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                
                <div class="calendar-grid">
                    <div class="day-name">DOM.</div><div class="day-name">LUN.</div>
                    <div class="day-name">MAR.</div><div class="day-name">MIÉ.</div>
                    <div class="day-name">JUE.</div><div class="day-name">VIE.</div>
                    <div class="day-name">SÁB.</div>
                    <div id="calendar-days" class="days-container"></div>
                </div>

                <div class="booking-info">
                    <p><i class="fa-solid fa-earth-americas"></i> Zona horaria: Buenos Aires</p>
                </div>
            </div>

            <div class="time-column">
                <div class="class-selector-container" style="margin-bottom: 20px;">
                    <label for="class-select" style="display: block; font-weight: bold; margin-bottom: 8px; color: #5d4037;">
                        ¿Qué clase quieres ver?
                    </label>
                    <select id="class-select" class="select-filter" style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #5d4037; background: white; font-family: inherit;">
                        <option value="reformer">Pilates Reformer</option>
                        <option value="hiit">HIIT Barre</option>
                        <option value="yoga">Yoga</option>
                    </select>
                </div>

                <h3 id="selected-date-display">Selecciona un día</h3>
                <div id="time-slots-grid" class="time-slots-vertical">
                    <p class="empty-msg">Selecciona un día para ver horarios.</p>
                </div>
            </div>

            <section class="user-reservations">
                <h3 id="summary-title">Mis Clases</h3>
                <ul id="reservation-list" class="reservation-list">
                    </ul>
            </section>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-info">
                <p><strong>Estudio Pilatea</strong> | Miguel Soler 311 | Contacto: +54 9 11 25922054</p>
            </div>
            <div class="social-links">
                <a href="#" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" target="_blank" class="social-icon"><i class="fa-brands fa-whatsapp"></i></a>
            </div>
        </div>
        <div class="copyright">&copy; 2026 Cazorla Estudio - Todos los derechos reservados.</div>
    </footer>

    <script type="module" src="../js/reservation.js"></script>
</body>
</html>
