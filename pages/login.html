<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilatea - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/main.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
    
<body class="page-login">

    <div class="login-wrapper">
        <main class="login-card">
            <header class="login-header">
                <img src="../assets/img/logo-pilatea-removebg-preview.png" alt="Estudio Pilatea">
                <h1>Iniciar Sesión</h1>
                <p>Ingresá para gestionar tus reservas</p>
            </header>

            <div id="login-error" class="error-msg" role="alert" style="color: red; margin-bottom: 1rem; display: none;"></div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="email"><i class="fa-solid fa-envelope" aria-hidden="true"></i> Email</label>
                    <input type="email" id="email" placeholder="ejemplo@mail.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock" aria-hidden="true"></i> Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            
                <button type="submit" class="btn-login">Entrar</button>
            
                <footer class="login-footer">
                    <a href="#" class="forgot-pass">¿Olvidaste tu contraseña?</a>
                    <hr>
                    <p class="no-account">¿No tenés cuenta?</p>
                    <p><strong>Contactanos en el local para registrarte</strong></p>
                </footer>
            </form>
        </main>
    </div>

    <script type="module" src="../js/auth/login.js"></script>
</body>
</html>
